framework: "net10.0"
overview: "Scheduled task that checks the Jellyfin database and repairs foreign key problems"
description: >
  Adds a scheduled task, "Database optimize", that reads the live schema of jellyfin.db (every table
  and every foreign key), checks the integrity of the database, looks for orphaned rows and for
  inconsistent alternate versions (the cause of "FOREIGN KEY constraint failed" errors while
  scanning libraries) and repairs them in a single transaction. The plugin has no settings page:
  run the task from Dashboard > Scheduled Tasks.
category: "General"
owner: "andreadegiovine"
artifacts:
- "Jellyfin.Plugin.DatabaseOptimize.dll"
changelog: >
  0.1.0.0 - First version: schema and foreign key discovery, integrity check, orphaned rows
  cleanup, alternate versions repair and a daily scheduled task.
